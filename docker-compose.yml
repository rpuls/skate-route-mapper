services:
  db:
    image: postgres:16-alpine
    container_name: skate-route-mapper-db
    environment:
      POSTGRES_DB: skate_route_mapper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skate_route_mapper"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: skate-route-mapper-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:postgres@db:5432/skate_route_mapper
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: skate-route-mapper-admin
    depends_on:
      - api
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:

services:
  db:
    image: postgres:16-alpine
    container_name: skate-route-mapper-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skate_route_mapper}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skate_route_mapper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: skate-route-mapper-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${API_PORT:-3001}
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/skate_route_mapper}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MOBILE_INGESTION_API_KEY: ${MOBILE_INGESTION_API_KEY:-local-dev-mobile-ingestion-key}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-dev-admin-dashboard-key}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-admin@example.com}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-local-dev-admin-password}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-24}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    container_name: skate-route-mapper-admin
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
